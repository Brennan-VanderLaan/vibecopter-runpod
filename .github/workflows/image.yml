name: Test and publish RunPod image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      reference: ${{ steps.identity.outputs.image }}@${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image identity
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "$image:latest" >> "$GITHUB_OUTPUT"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi
          echo EOF >> "$GITHUB_OUTPUT"
      - name: Build test candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: testbox:ci
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runner, SSH and CPU versus GPU gates
        run: bash ci-smoke.sh testbox:ci
      - name: Export dependency inventory
        run: docker run --rm testbox:ci cat /opt-image-packages.txt > image-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-packages-${{ github.sha }}
          path: image-packages.txt
      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.tags }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Publication receipt
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee image-reference.txt
          echo "Image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'CPU/SSH tests passed. Real NVIDIA GPU, native Unreal and RunPod acceptance remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: image-reference
          path: image-reference.txt

  anonymous-pull:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull and test exact published digest without registry credentials
        env:
          IMAGE: ${{ needs.image.outputs.reference }}
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull "$IMAGE"
          bash ci-smoke.sh "$IMAGE"
          echo "Anonymous pull and SSH/runner checks passed for \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
